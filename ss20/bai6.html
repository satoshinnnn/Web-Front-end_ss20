<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=+prompt('nhap vao so nguyen bat ky');
        let count=0;
        if(isNaN(num) || num<=1){
            alert('gia tri nhap vao khong hop le');
            count=1;
        }else{
            for(let i=2; i<=Math.sqrt(num);i++){
                if(num%i===0){
                    alert('khong la so nguyen to');
                    count=2;
                    break;
                }
            }
        }
        if(count==0){
            alert('la so nguyen to');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n=+prompt('nhap vao so nguyen duong n');
        let next, f0=1,f1=1;
        if(isNaN(n)|| n<0){
            alert('giu lieu nhap vao khong hop le');
        }else{
            if(n==0){
                document.write('1');
            }else if(n==1){
                document.write('1');
            }else{
                document.write('1 1 ');
                for(let i=3; i<=n;i++){
                    next= f0+f1;
                    document.write(next+" ");
                    f0=f1;
                    f1=next;
                }
            }
        }
    </script>
</body>
</html>

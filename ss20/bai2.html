<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=+prompt("nhap vao so nguyen bat ky");
        if(!isNaN(num)&& num>=0){
            document.write('cac so chia het cho 5 tu '+ num+' la: ');
            for(let i=1; i<=num; i++){
                if(i%5==0){
                    document.write(' '+i);
                }
            }
        }else{
            alert('du lieu ban nhap khong hop le');
        }
    </script>
</body>
</html>

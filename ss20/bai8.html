<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n=+prompt('nhap vao so nguyen bat ky');
        let count=1, num=2,flag=0;
        if(isNaN(n)|| n<0){
            alert('giu lieu nhap vao khong hop le');
        }else{
            while(count!=(n+1)){
                flag=0;
                for(let i=2; i<=Math.sqrt(num);i++){
                    if(num%i===0){
                        flag=1;
                        break;
                    }
                }
                if(flag==0){
                    document.write(num +' ');
                    count++;
                }
                num++
            }
        }
    </script>
</body>
</html>
